# Block C: as C1, but BatchNorm updates its statistics on batches of few samples.
name: C2_resnet18_bn_train
approach: finetune
backbone: resnet18.a1_in1k
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0]          # one repeat (6 folds): fine-tuning is ~100x the cost of a ridge run
epochs: 8
batch_size: 32
opt: adamw
lr: 3.0e-4
weight_decay: 0.05
warmup_epochs: 1
bn: train
agg: mean
