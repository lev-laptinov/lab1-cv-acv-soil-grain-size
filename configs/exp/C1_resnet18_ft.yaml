# Block C (CNN): ResNet-18 fine-tuned end to end; compare with T1 (frozen ResNet-50 + ridge).
name: C1_resnet18_ft
approach: finetune
backbone: resnet18.a1_in1k
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0]          # one repeat (6 folds): fine-tuning is ~100x the cost of a ridge run
epochs: 8
batch_size: 32
opt: adamw
lr: 3.0e-4
weight_decay: 0.05
warmup_epochs: 1
bn: frozen            # BatchNorm keeps the pretrained running statistics (no BatchNorm in ConvNeXt or ViT)
agg: mean
