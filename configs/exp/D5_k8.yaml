# Block D (data, on the O7 recipe: ResNet-18 bags with GroupNorm): 8 tiles per bag, 8 samples per step (64 tiles per step as in O7).
# Everything else as O7_groupnorm, the reference of this block; 3 repeats.
name: D5_k8
approach: finetune
backbone: resnet18.a1_in1k
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0, 1, 2]
bag_samples: 8
bag_tiles: 8
epochs: 8
opt: adamw
lr: 3.0e-4
weight_decay: 0.05
warmup_epochs: 1
bn: group
agg: mean
