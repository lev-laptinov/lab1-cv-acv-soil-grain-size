# Block D (data, on the O7 recipe: ResNet-18 bags with GroupNorm): grayscale input (luminance in 3 channels) in training and prediction: colour mostly encodes the phone.
# Everything else as O7_groupnorm, the reference of this block; 3 repeats.
name: D1_gray
approach: finetune
backbone: resnet18.a1_in1k
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0, 1, 2]
bag_samples: 4
bag_tiles: 16
epochs: 8
opt: adamw
lr: 3.0e-4
weight_decay: 0.05
warmup_epochs: 1
bn: group
grayscale: true
agg: mean
