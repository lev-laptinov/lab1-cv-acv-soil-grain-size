# Block C: as C1, but SGD with momentum instead of AdamW.
name: C3_resnet18_sgd
approach: finetune
backbone: resnet18.a1_in1k
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0]          # one repeat (6 folds): fine-tuning is ~100x the cost of a ridge run
epochs: 8
batch_size: 32
opt: sgd
lr: 0.01
weight_decay: 1.0e-4
warmup_epochs: 1
bn: frozen            # BatchNorm keeps the pretrained running statistics (no BatchNorm in ConvNeXt or ViT)
agg: mean
