# Block L (leave-one-device-out diagnostic): the O7_groupnorm recipe trained on Motorola Edge photos only and validated
# on the Motorola Edge photos of the held-out samples: same phone (reference). Same sample folds as every experiment;
# 21 of 24 samples have photos from both phones. Not a model for the test set.
name: L_O7_M2M
approach: finetune
backbone: resnet18.a1_in1k
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0, 1, 2]
bag_samples: 4
bag_tiles: 16
epochs: 8
opt: adamw
lr: 0.0003
weight_decay: 0.05
warmup_epochs: 1
bn: group
train_devices: [Motorola Edge]
val_devices: [Motorola Edge]
agg: mean
