# Block D (data, on the O7 recipe: ResNet-18 bags with GroupNorm): sharpness jitter: blur (sigma 0.5-1 px) or unsharp mask per tile, the Samsung-vs-iPhone 16 spread.
# Everything else as O7_groupnorm, the reference of this block; 3 repeats.
name: D3_sharpness
approach: finetune
backbone: resnet18.a1_in1k
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0, 1, 2]
bag_samples: 4
bag_tiles: 16
epochs: 8
opt: adamw
lr: 3.0e-4
weight_decay: 0.05
warmup_epochs: 1
bn: group
sharpness_aug: true
agg: mean
