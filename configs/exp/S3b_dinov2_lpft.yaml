# Block S: S3 rerun after the LP-FT fix (each phase gets its own optimizer and warmup). The first S3 run
# gave the unfrozen backbone full lr with empty Adam moments and collapsed in 4 of 6 folds.
name: S3b_dinov2_lpft
approach: finetune
backbone: vit_small_patch14_dinov2.lvd142m
pretrained: true
tile_mm: 50
work_ppm: 4.5
repeats: [0, 1, 2]
epochs: 11
batch_size: 32
opt: adamw
lr: 1.0e-4
weight_decay: 0.05
warmup_epochs: 1
bn: frozen            # BatchNorm keeps the pretrained running statistics (no BatchNorm in ConvNeXt or ViT)
agg: mean
layer_decay: 0.75
head_only_epochs: 3
