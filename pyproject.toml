[project]
name = "soilgsd"
version = "0.1.0"
description = "Soil grain-size distribution from smartphone photos with CNNs, ViTs and self-supervised encoders (KSE AI401, assignment 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pillow>=10.4",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0.15",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "kaggle>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soilgsd"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
